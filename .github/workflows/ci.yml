name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4          # pin to a commit SHA before release
      - run: sudo apt-get update && sudo apt-get install -y fasm qemu-system-x86
      - run: chmod +x /tools/check-spdx.sh /tests/smoke.sh /tools/build.sh
      - run: tools/check-spdx.sh
      - run: tools/build.sh
      - run: sha256sum out/os.img           # fasm is deterministic: same source, same hash
      - run: tests/smoke.sh
      - uses: actions/upload-artifact@v4
        with: { name: os.img, path: out/os.img }
